pluginManagement {
    buildscript {
        repositories {
            mavenCentral()
            maven {
                url = uri("https://storage.googleapis.com/r8-releases/raw")
            }
        }
        dependencies {
            // Kotlin 2.4 metadata requires R8 9.1.29 or newer.
            classpath("com.android.tools:r8:9.1.29")
        }
    }
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        // CI(如GitHub Actions)访问国内镜像不稳定，跳过镜像直接用原仓库
        if (System.getenv('CI') != 'true' && System.getenv('GITHUB_ACTIONS') != 'true') {
            //镜像仓库(放在原仓库前面优先使用)
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        }
        //原仓库
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // CI(如GitHub Actions)访问国内镜像不稳定，跳过镜像直接用原仓库
        if (System.getenv('CI') != 'true' && System.getenv('GITHUB_ACTIONS') != 'true') {
            //镜像仓库(放在原仓库前面优先使用)
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        maven {
            url = uri("$rootDir/third_party/maven")
            content {
                includeModule("org.htmlunit", "htmlunit-core-js")
            }
        }
        //原仓库
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        maven {
            url = 'https://jitpack.io'
            content {
                includeGroupByRegex("com\\.github.*")
            }
        }
        mavenCentral()
    }
}
rootProject.name = 'legado'

include ':app'
include ':modules:book'
include ':modules:rhino'
